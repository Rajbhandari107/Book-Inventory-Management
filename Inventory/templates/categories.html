<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Categories</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <nav>
        <a href="/">Books</a> |
        <a href="/authors">Authors</a> |
        <a href="/categories">Categories</a> |
        <a href="/customers">Customers</a>
    </nav>
    <h1>Categories</h1>

    <h2>Add New Category</h2>
    <form action="/categories/add" method="post">
        <label>Category Name: <input type="text" name="category_name" required /></label><br />
        <button type="submit">Add Category</button>
    </form>

    <h2>Categories List</h2>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>CategoryID</th>
                <th>CategoryName</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for category in categories %}
            <tr>
                <td>{{ category.CategoryID }}</td>
                <td>{{ category.CategoryName }}</td>
                <td>
                    <form action="/categories/delete/{{ category.CategoryID }}" method="post" style="display:inline;">
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this category?');">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p><a href="/">Back to Books</a></p>
</body>
</html>
