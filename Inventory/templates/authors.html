<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Authors</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <nav>
        <a href="/">Books</a> |
        <a href="/authors">Authors</a> |
        <a href="/categories">Categories</a> |
        <a href="/customers">Customers</a>
    </nav>
    <h1>Authors</h1>

    <h2>Add New Author</h2>
    <form action="/authors/add" method="post">
        <label>Author Name: <input type="text" name="author_name" required /></label><br />
        <button type="submit">Add Author</button>
    </form>

    <h2>Authors List</h2>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>AuthorID</th>
                <th>AuthorName</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for author in authors %}
            <tr>
                <td>{{ author.AuthorID }}</td>
                <td>{{ author.AuthorName }}</td>
                <td>
                    <form action="/authors/delete/{{ author.AuthorID }}" method="post" style="display:inline;">
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this author?');">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p><a href="/">Back to Books</a></p>
</body>
</html>
