<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customers</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <nav>
        <a href="/">Books</a> |
        <a href="/authors">Authors</a> |
        <a href="/categories">Categories</a> |
        <a href="/customers">Customers</a>
    </nav>
    <h1>Customers</h1>

    <h2>Add New Customer</h2>
    <form action="/customers/add" method="post">
        <label>First Name: <input type="text" name="first_name" required /></label><br />
        <label>Last Name: <input type="text" name="last_name" required /></label><br />
        <label>Email: <input type="email" name="email" required /></label><br />
        <button type="submit">Add Customer</button>
    </form>

    <h2>Customers List</h2>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>CustomerID</th>
                <th>FirstName</th>
                <th>LastName</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for customer in customers %}
            <tr>
                <td>{{ customer.CustomerID }}</td>
                <td>{{ customer.FirstName }}</td>
                <td>{{ customer.LastName }}</td>
                <td>{{ customer.Email }}</td>
                <td>
                    <form action="/customers/delete/{{ customer.CustomerID }}" method="post" style="display:inline;">
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this customer?');">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p><a href="/">Back to Books</a></p>
</body>
</html>
